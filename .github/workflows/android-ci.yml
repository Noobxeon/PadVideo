name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed version from this revision
        type: boolean
        default: false

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-35 build-tools;34.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build
        env:
          PADVIDEO_TEST_SMB: '1'
        run: |
          python -m pip install impacket==0.13.0
          python docs/ci/smb-fixture.py > "$RUNNER_TEMP/padvideo-smb.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          python - <<'PYTHON'
          import socket
          import time

          for _ in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 1445), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit("SMB test fixture did not start")
          PYTHON
          bash gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Upload APKs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PadVideo-test-results
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-35 build-tools;34.0.0'
      - name: Build and verify release signature
        env:
          PADVIDEO_KEYSTORE_BASE64: ${{ secrets.PADVIDEO_KEYSTORE_BASE64 }}
          PADVIDEO_STORE_PASSWORD: ${{ secrets.PADVIDEO_STORE_PASSWORD }}
          PADVIDEO_KEY_ALIAS: ${{ secrets.PADVIDEO_KEY_ALIAS }}
          PADVIDEO_KEY_PASSWORD: ${{ secrets.PADVIDEO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PADVIDEO_KEYSTORE_BASE64:?Configure the PadVideo release keystore}"
          : "${PADVIDEO_STORE_PASSWORD:?Configure the keystore password}"
          : "${PADVIDEO_KEY_ALIAS:?Configure the key alias}"
          : "${PADVIDEO_KEY_PASSWORD:?Configure the key password}"
          umask 077
          signing_file="$RUNNER_TEMP/padvideo-release.jks"
          trap 'rm -f "$signing_file"' EXIT
          printf '%s' "$PADVIDEO_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          PADVIDEO_KEYSTORE_PATH="$signing_file" bash gradlew assembleRelease --stacktrace
          apk=app/build/outputs/apk/release/app-release.apk
          expected=964ff49dacee813a2c4e41a000ffd9f08dba6595af31a26d10d343ffeeb770b4
          signature_notes=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk")
          actual=$(awk -F ': ' '/Signer #1 certificate SHA-256 digest/ {print $2}' <<< "$signature_notes")
          test "$actual" = "$expected"
          version=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset="PadVideo-v${version}-release.apk"
          mkdir -p release
          cp "$apk" "release/$asset"
          (cd release && sha256sum "$asset" > SHA256SUMS.txt)
          printf 'release_tag=v%s\nrelease_asset=%s\n' "$version" "$asset" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$release_tag" "release/$release_asset" release/SHA256SUMS.txt \
            --title "PadVideo $release_tag" --target "$GITHUB_SHA" --generate-notes \
            --notes "安装 v1.1.0 前需卸载已安装的 v1.0.0。卸载会清除旧版应用内设置和观看记录。"
